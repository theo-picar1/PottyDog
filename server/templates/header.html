<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
      <img
        src="/static/images/happy_dog.png"
        alt="PottyDog logo"
        height="32"
      />
      <span class="fw-bold fs-4">PottyDog</span>
    </a>

    <!-- Right side -->
    <div class="ms-auto d-flex align-items-center gap-2">

      {% if not session.get('user_id') %}
        <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
        <a href="/register" class="btn btn-light btn-sm text-primary">Register</a>
      {% else %}

      <!-- Dropdown -->
      <div class="dropdown">
        <button
          class="btn btn-outline-light btn-sm dropdown-toggle"
          id="userDropdown"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          {% if session.get('is_admin') %}
            Admin
          {% else %}
            {{ userData.username or 'User' }}
          {% endif %}
        </button>

        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
          <li>
            <a class="dropdown-item" href="#">Profile</a>
          </li>
          <li>
            <a class="dropdown-item" href="/settings">Settings</a>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li>
            <form method="POST" action="/logout">
              <button
                type="submit"
                class="dropdown-item text-danger"
              >
                Logout
              </button>
            </form>
          </li>
        </ul>
      </div>

      {% endif %}
    </div>
  </div>
</nav>
