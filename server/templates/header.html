<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
      <img
        src="/static/images/happy_dog.png"
        alt="PottyDog logo"
        height="32"
      />
      <span class="fw-bold fs-4">PottyDog</span>
    </a>

    <div class="ms-auto d-flex align-items-center gap-2">
      {% if not session.get('user_id') %}
        <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
        <a href="/register" class="btn btn-light btn-sm text-primary">Register</a>
      {% else %}

      <button
        class="btn btn-outline-light btn-sm"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#userOffcanvas"
        aria-controls="userOffcanvas"
      >
        {% if session.get('is_admin') %}
          Admin
        {% else %}
          {{ userData.username or 'User' }}
        {% endif %}
      </button>
      {% endif %}
    </div>
  </div>
</nav>

<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="userOffcanvas"
  aria-labelledby="userOffcanvasLabel"
>
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="userOffcanvasLabel">
      {% if session.get('is_admin') %}
        Admin
      {% else %}
        {{ userData.username or 'User' }}
      {% endif %}
    </h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body p-0">
    <div class="list-group list-group-flush">
      <a class="list-group-item list-group-item-action" href="#">
        Profile
      </a>
      <a class="list-group-item list-group-item-action" href="/settings">
        Settings
      </a>
      <form method="POST" action="/logout">
        <button
          type="submit"
          class="list-group-item list-group-item-action text-danger"
        >
          Logout
        </button>
      </form>
    </div>
  </div>
</div>
