<h2 mat-dialog-title>{{ MESSAGES.BUTTON.DELETE_DEVICE_TEXT }}</h2>
<mat-dialog-content>
    <p>{{ MESSAGES.DEVICE.CONFIRM_DELETE_TEXT }}</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button class="confirm-button" (click)="onDelete()">{{ MESSAGES.BUTTON.CONFIRM_TEXT }}</button>
    <button mat-dialog-close class="close-button">{{ MESSAGES.BUTTON.CLOSE_TEXT }}</button>
</mat-dialog-actions>
