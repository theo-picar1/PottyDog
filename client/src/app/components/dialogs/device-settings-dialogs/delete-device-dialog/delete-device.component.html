<h2 mat-dialog-title>Delete device</h2>
<mat-dialog-content>
    <p>All data from this device will be deleted and cannot be restored. Would you like to proceed?</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button class="confirm-button">Confirm</button>
    <button mat-dialog-close class="close-button">Cancel</button>
</mat-dialog-actions>
