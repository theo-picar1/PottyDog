@if (!this.hasCamera) {
  <div class="no-camera">
    <mat-icon>videocam_off</mat-icon>
    <p>{{ MESSAGES.DEVICE.NO_CAMERA_TEXT }}</p>
  </div>
} @else {
  @if (this.isOffline) {
    <div class="offline-camera">
      <mat-icon>warning</mat-icon>
      <p>{{ MESSAGES.DEVICE.CAMERA_OFFLINE_TEXT }}</p>
    </div>
  } @else {
    <div class="online-camera">
      <mat-icon>photo_camera</mat-icon>
    </div>
  }
}
